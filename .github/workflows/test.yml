name: test

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Run Go tests
        run: go test ./...

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/wails/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/wails/frontend
        run: npm install

      - name: Build frontend
        working-directory: desktop/wails/frontend
        run: npm run build
