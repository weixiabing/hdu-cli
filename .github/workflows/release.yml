name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      - name: Build Linux CLI snapshot
        run: goreleaser build --snapshot --clean

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: |
            dist/*.tar.gz
            dist/checksums.txt

  build-desktop-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/wails
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/wails/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Wails CLI to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm install
        working-directory: desktop/wails/frontend

      - name: Build Wails app bundle
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 version
          wails3 task darwin:package

      - name: Create DMG
        run: |
          mkdir -p dist
          hdiutil create -volname "HDU Network" -srcfolder "bin/hdu-network.app" -ov -format UDZO "dist/hdu-network.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/wails/dist/hdu-network.dmg

  build-desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/wails
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/wails/frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Wails CLI to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Install frontend dependencies
        run: npm install
        working-directory: desktop/wails/frontend

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build Wails executable
        shell: pwsh
        run: |
          $env:PATH="$(go env GOPATH)\bin;$env:PATH"
          wails3 version
          wails3 task windows:build:native

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/wails/bin/hdu-network.exe

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-desktop-macos
      - build-desktop-windows
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-cli
          path: release/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/windows

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/*.tar.gz
            release/macos/**
            release/windows/*.exe
