name: 上传构建产物

on:
  push:
    branches:
      - main  # 仅当推送到 main 分支时触发

jobs:
  build-macos-arm64:
    name: 构建并上传 macOS ARM64 二进制文件
    runs-on: macos-latest
    steps:
      - name: 准备代码
        uses: actions/checkout@v3

      - name: 设置 Go 环境
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'

      - name: 构建二进制文件
        run: |
          go build -o gopeed-macos-arm64 

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gopeed-macos-arm64
          path: gopeed-macos-arm64
